name: quality

on:
  push:
    branches: [main, v2-firebase-sync]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check pwa.js
          node --check sw.js
          node --check firebase-config.js
          node --input-type=module --check < auth.js

      - name: Parse HTML
        run: |
          python - <<'PY2'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          parser = Parser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          print('index.html parsed successfully')
          PY2

      - name: Validate PWA and Firebase files
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path

          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          required_manifest = ['name', 'short_name', 'start_url', 'display', 'icons']
          missing = [key for key in required_manifest if key not in manifest]
          if missing:
              raise SystemExit(f'Manifest missing: {missing}')

          for icon in manifest['icons']:
              if not Path(icon['src']).exists():
                  raise SystemExit(f'Missing icon: {icon["src"]}')

          config = json.loads(Path('firebase.json').read_text(encoding='utf-8'))
          rules_path = config.get('firestore', {}).get('rules')
          if rules_path != 'firestore.rules' or not Path(rules_path).exists():
              raise SystemExit('Firestore rules configuration is missing')

          auth = Path('auth.js').read_text(encoding='utf-8')
          if 'firebasejs/12.19.0' not in auth:
              raise SystemExit('Expected pinned Firebase browser SDK version')

          rules = Path('firestore.rules').read_text(encoding='utf-8')
          required_rules = [
              'request.resource.data.scenarioId == documentId',
              'request.resource.data.scenario.updatedAt == request.resource.data.updatedAt',
              'allow delete: if false;'
          ]
          missing_rules = [needle for needle in required_rules if needle not in rules]
          if missing_rules:
              raise SystemExit(f'Firestore rule hardening missing: {missing_rules}')

          print('PWA and Firebase files validated')
          PY2
